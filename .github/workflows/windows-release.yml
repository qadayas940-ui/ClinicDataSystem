name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: ["codex/v1-complete", "codex/v1-5-build"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static security audit
        run: |
          python -m pip install bandit
          bandit -r apps config launcher.py -x "*/migrations/*" -lll

  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clinic_data
          POSTGRES_USER: clinic_user
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic_user -d clinic_data"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: test-only-not-for-production
      DATABASE_URL: postgresql://clinic_user@127.0.0.1:5432/clinic_data
      ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify PostgreSQL migrations
        run: python manage.py migrate --noinput
      - name: Run PostgreSQL test suite
        run: python manage.py test

  build:
    needs: [postgres-tests, security-audit]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-build.txt
      - name: Verify application
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path "config/settings/base.py" -Pattern 'APP_VERSION = "([^"]+)"'
          if (-not $match) { throw "APP_VERSION was not found." }
          "value=$($match.Matches[0].Groups[1].Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Build desktop bundle
        run: pyinstaller --clean --noconfirm ClinicDataSystem.spec
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ClinicDataSystem.iss'
      - name: Verify versioned installer
        shell: pwsh
        run: if (-not (Test-Path "release/ClinicDataSystem-Setup-${{ steps.version.outputs.value }}.exe")) { throw "Expected versioned installer was not created." }
      - name: Build direct ZIP
        shell: pwsh
        run: Compress-Archive -Path "release/ClinicDataSystem-Setup-${{ steps.version.outputs.value }}.exe" -DestinationPath "release/ClinicDataSystem-Windows-${{ steps.version.outputs.value }}.zip" -Force
      - name: Verify ZIP contains installer
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression
          $archivePath = "release/ClinicDataSystem-Windows-${{ steps.version.outputs.value }}.zip"
          $installerPath = "release/ClinicDataSystem-Setup-${{ steps.version.outputs.value }}.exe"
          $expected = "ClinicDataSystem-Setup-${{ steps.version.outputs.value }}.exe"
          $archive = [System.IO.Compression.ZipFile]::OpenRead($archivePath)
          try {
            $matches = @($archive.Entries | Where-Object { $_.FullName -eq $expected })
            if ($matches.Count -ne 1) { throw "ZIP does not contain the expected installer." }
            if ($matches[0].Length -ne (Get-Item $installerPath).Length) { throw "Installer size inside ZIP differs from EXE." }
            Write-Host "Verified $expected inside $archivePath ($($matches[0].Length) bytes)."
          } finally {
            $archive.Dispose()
          }
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClinicDataSystem-Windows-${{ steps.version.outputs.value }}
          path: |
            release/ClinicDataSystem-Setup-${{ steps.version.outputs.value }}.exe
            release/ClinicDataSystem-Windows-${{ steps.version.outputs.value }}.zip
          if-no-files-found: error
      - name: Publish downloadable EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-build-${{ github.run_number }}
          name: Windows build ${{ github.run_number }}
          prerelease: true
          files: |
            release/ClinicDataSystem-Setup-${{ steps.version.outputs.value }}.exe
            release/ClinicDataSystem-Windows-${{ steps.version.outputs.value }}.zip
