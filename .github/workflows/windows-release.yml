name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: ["codex/v1-complete", "codex/v1-5-build"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clinic_data
          POSTGRES_USER: clinic_user
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic_user -d clinic_data"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: test-only-not-for-production
      DATABASE_URL: postgresql://clinic_user@127.0.0.1:5432/clinic_data
      ALLOWED_HOSTS: 127.0.0.1,localhost,testserver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify PostgreSQL migrations
        run: python manage.py migrate --noinput
      - name: Run PostgreSQL test suite
        run: python manage.py test

  build:
    needs: postgres-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-build.txt
      - name: Verify application
        env:
          DJANGO_SETTINGS_MODULE: config.settings.testing
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
      - name: Build desktop bundle
        run: pyinstaller --clean --noconfirm ClinicDataSystem.spec
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ClinicDataSystem.iss'
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClinicDataSystem-Windows-1.5.3
          path: release/*.exe
          if-no-files-found: error
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          generate_release_notes: true
