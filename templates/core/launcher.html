<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>جارٍ التشغيل…</title>
    <style>
        body { font-family: 'Tajawal', 'Segoe UI', sans-serif; background:#1a5276; color:#fff;
               display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
        .box { text-align:center; }
        .spinner { width:56px; height:56px; border:6px solid rgba(255,255,255,.3);
                   border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        h1 { font-size:1.4rem; margin:0 0 8px; }
        p { opacity:.85; }
    </style>
</head>
<body>
    <div class="box">
        <div class="spinner"></div>
        <h1>نظام إدارة بيانات ومرضى العيادة</h1>
        <p>جارٍ تشغيل الخادم، يرجى الانتظار…</p>
    </div>
</body>
</html>
